version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: aditya
      POSTGRES_PASSWORD: aditya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - db

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true    # ← Add this for file watching
      - VITE_HOST=0.0.0.0            # ← Add this for Vite
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data: