services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: aditya
      POSTGRES_PASSWORD: aditya
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aditya -d skillswap"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - /app/.venv
    environment:
      PYTHONUNBUFFERED: 1
      DB_HOST: db
      DB_NAME: skillswap
      DB_USER: aditya
      DB_PASSWORD: aditya
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./Frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: true
      VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  postgres_data: