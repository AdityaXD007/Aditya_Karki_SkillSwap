{% extends "admin/base.html" %}
{% load static %}

{% block title %}{{ title }} | SkillSwap Admin Dashboard{% endblock %}

{% block branding %}
<h1 id="site-name">
    <a href="{% url 'admin:index' %}" style="display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-random" style="color: #673ab7;"></i>
        SkillSwap Admin
    </a>
</h1>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<link rel="stylesheet" href="{% static 'admin/css/custom_admin.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body, #header, #content, .module h2, .module caption, .inline-group h2, .button, input, select, textarea {
        font-family: 'Inter', sans-serif !important;
    }
</style>
{% endblock %}

{% block nav-global %}{% endblock %}
