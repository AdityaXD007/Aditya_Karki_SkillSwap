<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
        .header { background: linear-gradient(135deg, #2563eb, #3b82f6); padding: 40px 20px; text-align: center; color: white; }
        .header h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.025em; }
        .content { padding: 40px 30px; line-height: 1.6; }
        .footer { padding: 30px; text-align: center; font-size: 14px; color: #64748b; background: #f1f5f9; }
        .button { display: inline-block; padding: 14px 28px; background-color: #2563eb; color: #ffffff !important; text-decoration: none; border-radius: 12px; font-weight: 600; margin-top: 25px; transition: background-color 0.2s; }
        .details-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin: 24px 0; }
        .detail-item { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px solid #eff6ff; padding-bottom: 8px; }
        .detail-label { font-weight: 600; color: #64748b; font-size: 14px; }
        .detail-value { color: #1e293b; font-weight: 500; text-align: right; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SkillSwap</h1>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>&copy; 2026 SkillSwap. All rights reserved.</p>
            <p>You received this because you enabled email notifications. <a href="{{ frontend_url }}/settings" style="color: #2563eb;">Manage preferences</a></p>
        </div>
    </div>
</body>
</html>
